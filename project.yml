# The app, for the Mac and iPad, for Xcode and Xcode Cloud. XcodeGen generates conflux.xcodeproj
# from this file, and the generated project is not committed:
#
#   ci_scripts/ci_post_clone.sh
#
# fetches the pinned XcodeGen and generates it, on Xcode Cloud and on a desk.
# `swift build` and `swift test` don't use this file. The app target compiles
# Sources/conflux against the package's ConfluxCore and ConfluxUI libraries, so
# the code is the same either way. docs/releasing.md says how a release reaches TestFlight.
#
# No Team ID here, or anywhere else in the repository. Signing settings come
# from App/Signing.xcconfig, which includes the untracked
# App/Signing.local.xcconfig.
name: conflux

options:
  bundleIdPrefix: com.caseybisson
  deploymentTarget:
    # Apple's on-device model reads images from 27 (docs/plan.md, Phase 4).
    # Package.swift says the same.
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Debug: App/Signing.xcconfig
  Release: App/Signing.xcconfig

settings:
  base:
    # release-please updates this line. Xcode Cloud numbers the builds, so
    # CURRENT_PROJECT_VERSION stays 1.
    MARKETING_VERSION: "0.7.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
  configs:
    Release:
      # Xcode Cloud builds Release, with whatever Xcode is current, after a
      # tag. A warning here can be an error there, so it is one here too.
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  ConfluxPackage:
    path: .

targets:
  conflux:
    type: application
    platform: macOS
    sources:
      - path: Sources/conflux
      - path: App/Assets.xcassets
      # The privacy manifest. tools/ci/check-app.sh checks it against what the
      # archived binaries import.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The licences of what the app includes, shown in its About window.
      # tools/notices/make-notices.py writes it, and tools/ci/check-app.sh
      # checks it names the versions Package.swift pins.
      - path: App/Credits.html
        buildPhase: resources
      # The starter model, served until the person chooses one
      # (Sources/ConfluxCore/StarterModel.swift). Fetched, never committed:
      # tools/ci/fetch-starter-model.sh puts it here, and ci_post_clone.sh
      # runs that before generating this project.
      - path: App/StarterModel
        type: folder
        buildPhase: resources
    dependencies:
      - package: ConfluxPackage
        product: ConfluxCore
      # What the Mac app and the iPad app show the same way.
      - package: ConfluxPackage
        product: ConfluxUI
    postBuildScripts:
      # Xcode's asset catalog compiler writes an AppIcon.icns without the 512pt
      # sizes, and App Store Connect refuses that (ITMS-90236). This rebuilds it
      # from the same PNGs, before the bundle is signed. tools/ci/check-app.sh
      # checks the result.
      - name: Complete the app icon
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_16x16.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_16x16@2x.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_32x32.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_32x32@2x.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_128x128.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_256x256.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_256x256@2x.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_512x512.png
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns
        script: |
          set -euo pipefail
          work="$DERIVED_FILE_DIR/AppIcon.iconset"
          rm -rf "$work"
          mkdir -p "$work"
          cp "$SRCROOT"/App/Assets.xcassets/AppIcon.appiconset/icon_*.png "$work"/
          iconutil -c icns "$work" -o "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
    entitlements:
      path: App/conflux.entitlements
      properties:
        # App Store Connect, TestFlight included, takes only sandboxed apps.
        com.apple.security.app-sandbox: true
        # The gateway listens on loopback, and so does the host service that
        # peers reach over iroh.
        com.apple.security.network.server: true
        # The mesh: iroh's connections to peers and relays, and the gateway's
        # to the loopback ports iroh forwards to peers.
        com.apple.security.network.client: true
        # Model files are the ones the user picks, kept across launches by
        # security-scoped bookmarks (Sources/conflux/ModelAccess.swift).
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        # The keychain. The first group is the app's own, where the device's
        # secret key stays, ThisDeviceOnly: listing it first keeps it the
        # default, as it was before there was a second. The second is the
        # device directory, shared by every build of the app: each device
        # lists its public endpoint ID there, synced by iCloud Keychain
        # (Sources/ConfluxCore/DeviceDirectory.swift). The prefix is the
        # team's, filled in when Xcode signs; never write it out here.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)com.caseybisson.conflux.devices
    settings:
      base:
        PRODUCT_NAME: conflux
        PRODUCT_BUNDLE_IDENTIFIER: com.caseybisson.conflux
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: conflux
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Without this, every TestFlight build waits on an export-compliance
        # question. NO means the app uses no NON-EXEMPT encryption. It does use
        # encryption, and this is every use of cryptography in what the app
        # compiles and links:
        #
        # - Sources/ConfluxCore/LlamaServerHost.swift: FileHash takes the
        #   SHA-256 of the model files, through CryptoKit, so a host can say
        #   which model it serves. A fingerprint: no key, nothing encrypted.
        # - Sources/ConfluxCore/Gateway.swift: the gateway's bearer token is 32
        #   bytes from SecRandomCopyBytes, compared on each request. A secret,
        #   not a key: nothing is encrypted with it.
        # - Sources/ConfluxCore/DeviceIdentity.swift: keeps this device's iroh
        #   key in the keychain, and derives its public half, the endpoint ID,
        #   through CryptoKit's Ed25519. A signing key's public half: nothing
        #   is encrypted here.
        # - Sources/ConfluxCore/DeviceDirectory.swift: keeps each device's
        #   endpoint ID, a public key, with a name and a date, as a keychain
        #   item iCloud Keychain syncs between the user's devices. Storage
        #   through the operating system's keychain: nothing is encrypted here.
        # - apple-iroh v0.10.0: iroh's connections between the user's own
        #   devices, and to its relays, are QUIC with TLS 1.3, and each device's
        #   identity is an Ed25519 key. The cryptography is compiled into the
        #   app, not the operating system's: rustls with ring, which implement
        #   those IETF standards, not proprietary cryptography. It authenticates
        #   peers and protects the requests and answers between them.
        # - The gateway serves plain HTTP on loopback (HTTPServer.swift), and
        #   LlamaServerHost talks plain HTTP to llama-server on loopback. No TLS.
        # - llama.framework holds no cryptography.
        #
        # The answer, the maintainer's (2026-11-07), for App Store Connect: the
        # app uses encryption, and qualifies for an exemption under the U.S.
        # EAR, Category 5 Part 2, as a mass-market product using standard
        # cryptography for authentication and data protection. The reasoning
        # is in docs/releasing.md, "Export compliance: the reasoning".
        #
        # **Answer it again when this list changes.** tools/ci/check-app.sh
        # fails when a source file not named above uses Apple's cryptography or
        # TLS, when the archive holds a bundled cryptography library other than
        # apple-iroh's, and when Package.swift pins an apple-iroh other than the
        # one named above.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # A build from Xcode gets its own sandbox container, settings and
        # privacy grants, apart from the TestFlight app on the same Mac.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.caseybisson.conflux.dev

  # The same app on iPadOS: one bundle ID, so one App Store Connect record
  # and one TestFlight track for both platforms, and one keychain access
  # group. An iPad is a host only (docs/plan.md, Phase 3): it serves a model
  # copied into its Documents folder to the Macs' gateways, and its memory
  # probe checks whether a model fits (Sources/conflux-ipad).
  conflux-ipad:
    type: application
    platform: iOS
    sources:
      - path: Sources/conflux-ipad
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Credits.html
        buildPhase: resources
      - path: App/StarterModel
        type: folder
        buildPhase: resources
    dependencies:
      - package: ConfluxPackage
        product: ConfluxCore
      # What the Mac app and the iPad app show the same way.
      - package: ConfluxPackage
        product: ConfluxUI
    # Xcode generates the rest of the Info.plist from INFOPLIST_KEY_ settings,
    # which don't cover these.
    info:
      path: App/conflux-ipad-Info.plist
      properties:
        # Models are copied in from a Mac: in Finder, the iPad's Files tab
        # shows conflux's Documents folder, and the Files app does too.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # XcodeGen writes 1.0 otherwise: the versions release-please and
        # Xcode Cloud set, as the Mac app's are.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The team's prefix, which signing fills in, so the app can name the
        # device directory's keychain group: iPadOS has no API to read an
        # app's entitlements (Sources/ConfluxCore/DeviceDirectory.swift).
        ConfluxAppIdentifierPrefix: $(AppIdentifierPrefix)
        # iroh connects straight to the Macs on the same network when it can,
        # rather than through a relay, and iPadOS asks first.
        NSLocalNetworkUsageDescription: conflux connects directly to your Macs on this network, to serve them its model.
    entitlements:
      path: App/conflux-ipad.entitlements
      properties:
        # A larger per-app memory limit, on devices that allow one, so a
        # bigger model fits. The probe measures what it buys.
        com.apple.developer.kernel.increased-memory-limit: true
        # A larger address space, so llama.cpp can map a model file of
        # several gigabytes.
        com.apple.developer.kernel.extended-virtual-addressing: true
        # The keychain, as on the Mac: the app's own group first, where the
        # device's secret key stays, ThisDeviceOnly; then the device
        # directory every build of the app shares, synced by iCloud Keychain.
        # The prefix is the team's, filled in when Xcode signs.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)com.caseybisson.conflux.devices
    settings:
      base:
        PRODUCT_NAME: conflux
        PRODUCT_BUNDLE_IDENTIFIER: com.caseybisson.conflux
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: conflux
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # The same answer as the Mac target's, for the same code: see the
        # export-compliance note there.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.caseybisson.conflux.dev

schemes:
  conflux:
    build:
      targets:
        conflux: all
    run:
      config: Debug
    archive:
      config: Release
  conflux-ipad:
    build:
      targets:
        conflux-ipad: all
    run:
      config: Debug
    archive:
      config: Release
