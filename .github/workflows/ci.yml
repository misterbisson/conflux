name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release-please starts this on its release pull request, which its token
  # can't otherwise trigger. The release is the last check before Xcode Cloud.
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request, or a newer release pull request, replaces
# the run in progress. Runs on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Xcode Cloud builds releases with its latest Xcode. .xcode-version records
  # which that is, and every macOS job here uses it (docs/releasing.md).
  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.xcode.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner for .xcode-version
        id: xcode
        run: tools/ci/xcode-runner.sh >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: toolchain
    runs-on: ${{ needs.toolchain.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: tools/ci/select-xcode.sh
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Fetch the test model
        run: echo "CONFLUX_TEST_MODEL=$(tools/ci/fetch-test-model.sh)" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release

  # What Xcode Cloud does after a tag, short of signing and uploading: generate
  # the project with its post-clone hook, archive Release, and check the app
  # for what App Store Connect requires. No secrets: the archive is signed ad
  # hoc.
  app:
    name: app
    needs: toolchain
    runs-on: ${{ needs.toolchain.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: tools/ci/select-xcode.sh
      - name: Generate the project
        run: ci_scripts/ci_post_clone.sh
      - name: Archive and check
        run: tools/ci/build-app.sh

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public-repository checks
        run: tools/ci/check-public.sh
      - name: Lint workflows
        run: tools/ci/actionlint.sh
      - name: Lint shell scripts
        run: shellcheck tools/bench/*.sh tools/ci/*.sh ci_scripts/*.sh
      - name: Commit message check
        run: tools/ci/test-check-commit-message.sh
